<div class="navbar bg-base-100 border border-base-300 rounded-xl px-3 min-h-16">
  <div class="navbar-start">
    <button class="btn btn-ghost btn-square" (click)="previousMonth()" aria-label="Previous month">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="size-5"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
  </div>

  <div class="navbar-center flex-col gap-0">
    <span class="font-semibold text-base">
      {{ monthLabel }}
    </span>
    <span class="text-xs text-base-content/50"> เลือกเดือนที่ต้องการดูข้อมูล </span>
  </div>

  <div class="navbar-end">
    <button class="btn btn-ghost btn-square" (click)="nextMonth()" aria-label="Next month">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="size-5"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
  </div>
</div>

<div class="flex justify-center mt-2">
  <button class="btn btn-soft btn-sm" (click)="goToCurrentMonth()">กลับไปเดือนปัจจุบัน</button>
</div>
